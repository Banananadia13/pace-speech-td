}
function ndisPage(){
  SECN=0;
  var h='<div class="lockup"><div class="eyebrow">Induction session · outside the six</div>'+
    '<h2>NDIS Essentials</h2><p class="subline">How the funding works, what we have to write, and why it is getting harder.</p></div>'+
    '<div class="note"><b>Why this sits outside the rotation.</b> This is orientation and compliance content, not clinical development. It does not gain much from open discussion — a new grad has no experience to reason from yet. Delivering it in week one also solves the "it needs to be earlier" problem better than any slot in a fortnightly sequence. It needs an owner on the onboarding checklist or it will get missed.</div>'+
    '<div class="card"><h4>By the end, they can</h4><ul class="t">'+
    '<li>Describe the referral routes into PACE and how they differ</li>'+
    '<li>Explain which funding a speech pathology service is drawn from</li>'+
    '<li>Write a progress report that supports a funding request</li>'+
    '<li>Explain to a family, accurately, what their funding does and does not cover</li></ul></div>';
  h+=block({t:"steps",title:"The session",items:[
    ["Where clients come from","<ul><li>Private, Medicare (GP-referred plans) and NDIS — what changes clinically, and what changes administratively</li><li>Documentation requirements are broadly the same across all three. The reporting requirement is not</li></ul>"],
    ["How the NDIS works, briefly","<ul><li>Plans, funding categories, and which bundle speech pathology is drawn from — a question families ask constantly</li><li>Funding periods, and what happens when funds run out mid-plan</li><li>Plan reviews and reassessments, and what we need ready in advance</li></ul>"],
    ["Writing for the NDIS","<ul><li>Progress reports: what has changed, evidenced how, and what remains</li><li>Funding requests: functional impact, what was trialled, what it enabled, what happens without it</li><li>Writing about function rather than impairment — the observational data from Workshop 2 matters here</li><li>Why vague goals produce declined requests</li><li>The environment is tightening. Requests that would have passed two years ago will not now</li></ul>"],
    ["Talking to families about money","<ul><li>Being straight about costs, session counts and what a plan will stretch to</li><li>What to do when funding runs out and the child still needs support</li></ul>"]]});
  h+='<div class="note warn"><b>Alternative.</b> If an induction session is not practical, fold this into Workshop 3, which already covers documentation. The join is not artificial — but Workshop 3 becomes the heaviest hour in the module and funding mechanics get about fifteen minutes.</div>';
  h+='<div class="btnrow"><button class="btn ghost" data-go="w6">← Workshop 6</button>'+
     '<button class="btn" data-go="res">Resources →</button></div>';
  return h;
}
var A=function(u,t){return '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>'};
function resPage(){
  SECN=0;
  var UTS='https://www.uts.edu.au/research/centres/australian-stuttering-research-centre/resources';
  var h='<div class="lockup"><div class="eyebrow">Reference · outside the six</div>'+
    '<h2>Resources</h2><p class="subline">Where to look things up, what each source is good for, and where it stops.</p></div>'+
    '<div class="note"><b>These are the sources we actually work from,</b> sent through by Angela in September 2026. Versions were checked on 18 September 2026 — the stuttering manuals in particular are revised often, so take the guide from the site rather than from a copy someone saved.</div>';

  h+=block({h:"Stuttering",p:"Our stuttering protocols are based on the programs developed at the Australian Stuttering Research Centre at UTS. Everything below is free."});
  h+=wTable({head:["What","Use it for"],rows:[
    [A(UTS+'/lidcombe-program','Lidcombe Program Treatment Guide')+' <span class="tag">v1.7c · Aug 2025</span>',
     "Preschool stuttering. Parent-delivered verbal contingencies — your job is to train and supervise the parent, weekly, with severity ratings in front of you."],
    [A(UTS+'/westmead-program','Westmead Program Treatment Guide')+' <span class="tag">v1.3 · Feb 2023</span>',
     "The syllable-timed alternative for preschoolers, with audio and video models of the speech pattern on the same page. Worth knowing before you need it."],
    ["Child Stuttering Severity Chart <span class=\"tag\">Dec 2022</span>",
     "The parent's daily 0–9 rating. It is the measure that drives the treatment decisions and your outcome data — set it up in session one, not at review."],
    ["Stuttering Treatment Activity Guides <span class=\"tag\">preschool · school-age</span>",
     "Practical activity ideas for treatment sessions, split by age. Useful for a clinician who has the manual and still cannot picture the hour."],
    [A(UTS,'Stuttering and its clinical management — twelve lectures')+' <span class="tag">Aug 2026</span>',
     "The closest thing to a free textbook, updated last month. Send new grads to the lecture on the condition in front of them rather than the whole thing."],
    ["Parent and teacher handouts",
     "Preschool teachers, stuttering in schools, and bullying and stuttering. Hand these over rather than writing your own — and they answer the parent-guilt question better than you will in the room."]]});
  h+=block({t:"note",body:"<b>Do not improvise a stuttering plan.</b> Manualised programs exist, the evidence sits behind them, and \"we tried some strategies\" does not survive a plan review. If a case does not fit the manual, that is a supervision conversation."});

  h+=block({h:"Neurodiversity-affirming practice",p:"Both of these are led by Autistic people. This is the reading behind Workshop 4."});
  h+=wTable({head:["What","Use it for"],rows:[
    [A('https://reframingautism.org.au/','Reframing Autism')+' <span class="tag">Australian · free</span>',
     "Autistic-led charity. Free resource library, a free Autism Essentials course, and material written for families — including a welcome pack for newly identified Autistic people. Use it for language, identity and what to hand a parent after a diagnosis."],
    [A('https://playlearnchat.com/','Play. Learn. Chat.')+' <span class="tag">Adina Levy</span>',
     "Run by an Autistic ADHDer speech pathologist. The free podcast and downloads are the entry point; the paid learning hub and the affirming report-language tools are the depth. Closest fit to the goal and report writing in Workshops 3 and 4."]]});
  h+=block({t:"note",tone:"warn",body:"<b>Most of the Play. Learn. Chat. depth is paid.</b> If a clinician wants the learning hub, that is a professional development budget conversation with their supervisor, not a personal expense."});

  h+=block({h:"Feeding, and informed choice",p:"Relevant to Workshop 6, and to any child on your caseload who eats and drinks with known risk."});
  h+=wTable({head:["What","Use it for"],rows:[
    [A('https://www.speechpathologyaustralia.org.au/Common/Uploaded%20files/Smart%20Suite/Smart%20Library/1b67af79-1074-4a30-a9a0-61f3eccb7b2d/20200221%20Position%20Statement%20Risk%20Feeding.pdf','SPA — informed choice and shared decision making in dysphagia')+' <span class="tag">position statement</span>',
     "The Australian position, and it explicitly covers infants and children. The four things to take from it: a signed waiver is not informed consent, the decision sits with the team and the family, the discussion must be documented, and the person can change their mind at any time."],
    ["SPA Smart Library <span class=\"tag\">member login</span>",
     "Angela's link goes to the members' library, so you will need to be signed in to SPA to open it. The position statement above is the same content in a public file."],
    ["Royal Children's Hospital feeding document <span class=\"tag\">to come</span>",
     "Angela intended to send a second, paediatric-specific document. Both links in her email resolved to the SPA resource, so this one is still outstanding."]]});

  h+=block({h:"Clinical topics",p:"For the nights when a condition walks in that you have not seen since university."});
  h+=wTable({head:["What","Use it for"],rows:[
    [A('https://www.asha.org/practice-portal/','ASHA Practice Portal')+' <span class="tag">United States</span>',
     "Peer-reviewed summaries by topic, each following the same shape: signs and symptoms, incidence, assessment, treatment, then references. Good for "+
     A('https://www.asha.org/practice-portal/clinical-topics/late-language-emergence/','late language emergence')+", "+
     A('https://www.asha.org/practice-portal/clinical-topics/childhood-apraxia-of-speech/','childhood apraxia of speech')+
     ", childhood fluency disorders, spoken and written language disorders, AAC, autism, social communication and paediatric feeding and swallowing."]]});
  h+=block({t:"note",tone:"warn",body:"<b>Read it as an American document.</b> Eligibility, school services and funding on those pages are US systems and do not describe anything we do. Some norms are US-normed, and the terminology differs from ours. Use it for clinical depth — mechanism, assessment logic, treatment options — and use Speech Pathology Australia, the NDIS and PACE policy for anything about what you are allowed to do."});

  h+='<div class="bar"><span class="lbl">The one thing</span>Australian sources first for anything procedural — scope, consent, reporting, funding. Everywhere else, use the best source you can find and say where it came from.</div>';
  h+='<div class="btnrow"><button class="btn ghost" data-go="ndis">← NDIS Essentials</button>'+
     '<button class="btn" data-go="fac">For facilitators →</button>'+
     '<button class="btn ghost" data-print="1">Print this page</button></div>';
  return h;
}
function facPage(){
  SECN=0;
  var h='<div class="lockup"><div class="eyebrow">Notes for Angela and Georgia</div>'+
    '<h2>For facilitators</h2><p class="subline">How to run these, what to mark up, and what still needs a decision.</p></div>';
  h+=block({t:"cards",title:"Running the hour",items:[
    ["You are not teaching","Two or three minutes to name the concept, then get out of the way. If you are talking for more than a third of the hour, switch to a prompt or open a widget."],
    ["Use the diagrams as the anchor","Share your screen and click through them together. It gives you both something to look at that is not each other, which makes hard answers easier."],
    ["Let them answer the quizzes","Do not click first. The wrong answer is more useful to you than the right one, and the explanations are written to be read aloud."],
    ["Silence is fine","New grads need longer than feels comfortable to answer a question nobody has asked them before."],
    ["Follow the disagreement","If they say something you would not have done, ask them to justify it rather than correcting it. That is the whole exercise."],
    ["Use your own caseload","The cases here are a fallback. A real client from this week will always work better."],
    ["Run them in order","Later sessions assume earlier ones — 3 leans on 2, and 6 leans on 5."],
    ["Skip freely","Nobody gets through all of this in an hour and you are not meant to. Pick the two or three things that matter for the person in front of you."]]});
  h+='<div class="bar"><span class="lbl">What to mark up</span>The discussion prompts and the quiz explanations are what you will actually read aloud. Cut anything that does not sound like something you would say. Case names, ages and details are all fair game too.</div>';
  h+='<h3 class="sec"><span class="badge">1</span>Open decisions</h3>'+
    wTable({head:["Decision","Who"],rows:[
      ["Whether NDIS Essentials runs as induction, or folds into Workshop 3","Georgia and Angela"],
      ["Feedback on the six workshop drafts","Angela — on her report-writing Friday"],
      ["Confirm the \"Who to go to\" wording now supervision may be shared between the south-east and Reservoir teams","Aidan, with Mark"],
      ["Finalise the feeding framing, screener questions and referral thresholds","Angela"],
      ["Send the Royal Children's feeding document — both links in the September email pointed to the same SPA resource","Angela"],
      ["Compliance check on restrictive practices, and point Workshop 5 at PACE policy","Needs an owner"],
      ["Confirm the internal referral process end to end, including how you learn a referral has been allocated","Aidan, with the OT team"],
      ["Katie's email address for the platform and handbook","Georgia or Angela"],
      ["Frequency — fortnightly, or something else","Georgia and Angela"],
      ["Whether the prompts and explanations sound like you","Both"]]});
  h+='<h3 class="sec"><span class="badge">2</span>Flagged, but not a training problem</h3><div class="card">'+
    '<p style="margin-top:0">The communication gap between the speech and OT teams came up repeatedly. Training can teach clinicians to ask who else is in the care team, and Workshops 1 and 6 both do that. It cannot fix the underlying issue, which is that OT runs on a different system and speech has no visibility of shared clients.</p>'+
    '<p style="margin-bottom:0">The suggestion from the meeting — a link between systems showing that a client has an OT, who it is, and since when, without needing access to their notes — is modest and would solve most of it.</p></div>';
  h+='<div class="btnrow"><button class="btn ghost" data-go="home">← Home</button>'+
     '<button class="btn ghost" data-print="1">Print everything</button></div>';
  return h;
}

/* ===================== APP ===================== */
var PAGES=[{id:"home",label:"Home",num:"",html:homePage}]
  .concat(MODULES.map(function(m){return {id:m.id,label:m.title,num:String(m.n),html:function(){return modulePage(m)}}}))
  .concat([{id:"ndis",label:"NDIS Essentials",num:"+",html:ndisPage},
           {id:"res",label:"Resources",num:"↗",html:resPage},
           {id:"fac",label:"For facilitators",num:"i",html:facPage}]);

var tabsEl=document.getElementById('tabs'), mainEl=document.getElementById('main');
tabsEl.innerHTML=PAGES.map(function(p){
  return '<button data-id="'+p.id+'" data-go="'+p.id+'">'+(p.num?'<span class="num">'+p.num+'</span>':'')+p.label+'</button>';
}).join('');
mainEl.innerHTML=PAGES.map(function(p){
  return '<section class="page" id="pg-'+p.id+'">'+p.html()+'</section>';
}).join('');

function go(id){
  PAGES.forEach(function(p){var el=document.getElementById('pg-'+p.id); if(el) el.classList.toggle('on',p.id===id)});
  Array.prototype.forEach.call(tabsEl.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.id===id)});
  try{location.hash=id}catch(e){}
  window.scrollTo(0,0);
  var t=tabsEl.querySelector('[data-id="'+id+'"]'); if(t&&t.scrollIntoView) t.scrollIntoView({block:'nearest',inline:'nearest'});
}

document.addEventListener('click',function(e){
  var t=e.target;
  var goBtn=t.closest('[data-go]');
  if(goBtn && !t.closest('.chk')){go(goBtn.dataset.go);return}
  if(t.closest('[data-print]')){window.print();return}

  var hot=t.closest('.hot');
  if(hot){
    var wrap=hot.closest('[data-dia]'); if(!wrap) return;
    var id=wrap.dataset.dia, d=DIAS[id][hot.dataset.h];
    Array.prototype.forEach.call(wrap.querySelectorAll('.hot'),function(x){x.classList.remove('sel')});
    hot.classList.add('sel');
    if(d) document.getElementById('dp-'+id).innerHTML='<h5>'+d[0]+'</h5><p>'+d[1]+'</p>';
    return;
  }
  var fc=t.closest('.fc'); if(fc){fc.classList.toggle('open');return}

  var chip=t.closest('.chip');
  if(chip){
    var cur=+chip.dataset.b, nx=cur>=2?1:cur+1;
    var bs=SORTS[chip.closest('[data-sort]').dataset.sort].buckets;
    chip.dataset.b=nx; chip.querySelector('.bk').textContent=nx===0?'?':bs[nx-1];
    chip.classList.remove('right','wrong'); return;
  }
  var chk=t.closest('[data-sortcheck]');
  if(chk){
    var sid=chk.dataset.sortcheck, s=SORTS[sid], w=document.querySelector('[data-sort="'+sid+'"]'), r=0;
    Array.prototype.forEach.call(w.querySelectorAll('.chip'),function(c){
      var ok=(+c.dataset.b)===s.items[+c.dataset.i][1];
      c.classList.toggle('right',ok); c.classList.toggle('wrong',!ok); if(ok) r++;
    });
    var ex=document.getElementById('se-'+sid);
    ex.innerHTML='<b>'+r+' of '+s.items.length+'.</b> '+(SORTEX[sid]||''); ex.classList.add('show'); return;
  }

  var opt=t.closest('.opt');
  if(opt){
    var q=opt.closest('[data-q]'), qid=q.dataset.q, ans=QUIZ[qid].a, pick=+opt.dataset.oi;
    Array.prototype.forEach.call(q.querySelectorAll('.opt'),function(o,i){
      o.classList.remove('pick-y','pick-n'); if(i===ans) o.classList.add('pick-y');
    });
    if(pick!==ans) opt.classList.add('pick-n');
    document.getElementById('qe-'+qid).classList.add('show'); return;
  }

  var ct=t.closest('.cmp-tabs button');
  if(ct){
    var cid=ct.parentNode.dataset.cmp, ci=ct.dataset.ci;
    Array.prototype.forEach.call(ct.parentNode.children,function(b){b.classList.remove('on')});
    ct.classList.add('on');
    Array.prototype.forEach.call(document.querySelectorAll('[data-cp^="'+cid+'-"]'),function(p){
      p.classList.toggle('on',p.dataset.cp===cid+'-'+ci)});
    return;
  }

  var ck2=t.closest('.ck');
  if(ck2){
    ck2.classList.toggle('on');
    var cw=ck2.closest('[data-ck]');
    document.getElementById('cc-'+cw.dataset.ck).textContent=
      cw.querySelectorAll('.ck.on').length+' of '+cw.querySelectorAll('.ck').length;
    return;
  }
  var sh=t.closest('.step-h'); if(sh){sh.parentNode.classList.toggle('open');return}
  var rb=t.closest('.reveal .btn-r'); if(rb){rb.parentNode.classList.add('on');return}
});

document.addEventListener('input',function(e){
  var r=e.target; if(r.type!=='range') return;
  var wrap=r.closest('[data-scale]'); if(!wrap) return;
  var id=wrap.dataset.scale, cfg=SCALES[id];
  wrap.querySelector('[data-sv="'+r.dataset.si+'"]').textContent=r.value;
  var vals=Array.prototype.map.call(wrap.querySelectorAll('input[type=range]'),function(x){return +x.value});
  var avg=vals.reduce(function(a,b){return a+b},0)/vals.length;
  var band=cfg.bands.filter(function(b){return avg>=b[0]&&avg<=b[1]})[0]||cfg.bands[1];
  var out=document.getElementById('so-'+id);
  out.style.background=band[3]; out.innerHTML='<b>Average '+avg.toFixed(1)+'.</b> '+band[2];
});

document.addEventListener('change',function(e){
  var b=e.target.closest('[data-done]'); if(!b) return;
  var d={}; try{d=JSON.parse(localStorage.getItem('pace-sp')||'{}')}catch(err){}
  d[b.dataset.done]=b.checked;
  try{localStorage.setItem('pace-sp',JSON.stringify(d))}catch(err){}
  paint();
});
function paint(){
  var d={}; try{d=JSON.parse(localStorage.getItem('pace-sp')||'{}')}catch(err){}
  MODULES.forEach(function(m){
    var b=document.getElementById('chk-'+m.id); if(b) b.checked=!!d[m.id];
    var t=tabsEl.querySelector('[data-id="'+m.id+'"]'); if(t) t.classList.toggle('done',!!d[m.id]);
  });
}
paint();
var start=(location.hash||'').replace('#','');
go(PAGES.some(function(p){return p.id===start})?start:'home');
window.addEventListener('hashchange',function(){
  var id=(location.hash||'').replace('#','');
  if(PAGES.some(function(p){return p.id===id})) go(id);
});
</script>
